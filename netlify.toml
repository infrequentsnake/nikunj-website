# Static site. Nothing to build, Netlify just publishes the folder as-is.
[build]
  publish = "."
  command = ""

# Serve /projects and /charity without the .html extension.
[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/charity"
  to = "/charity.html"
  status = 200

# Project docs and editor config ship in the folder but must not be readable
# on the live site, since CLAUDE.md carries the Netlify site ID.
[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/EDITING.md"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Revalidate rather than cache blind. There is no build step here, so filenames
# never change, which means a long max-age leaves returning visitors styling new
# HTML with an old stylesheet. Revalidation costs one 304 and is always correct.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
